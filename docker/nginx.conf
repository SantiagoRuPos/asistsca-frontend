# Nginx interno del contenedor "frontend": sirve el build estatico de
# Angular. No se publica al host -- solo el Nginx de entrada (servicio
# "nginx" del docker-compose.yml) le habla, por la red interna de Docker.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real (recargar la pagina en
    # /estudiantes, /reportes, etc.) debe resolver a index.html -- el router
    # de Angular decide que mostrar en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos generados por el build de produccion llevan un hash en
    # el nombre (outputHashing: all, ver angular.json) -- pueden cachearse
    # agresivamente porque un cambio de contenido siempre implica un nombre
    # de archivo distinto.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # index.html si debe revalidarse siempre: es el unico archivo sin hash
    # en el nombre, y es el que referencia a los demas.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
